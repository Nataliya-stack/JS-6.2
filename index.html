<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
        body {             
            background-image: url("./img/flores.jpg");
            background-repeat: no-repeat;
            background-position: center; 
            background-size: cover;
            background-attachment: fixed;
            margin: 0 auto;
            min-height: 100vh;          
            width: 100%;
            max-width: 1200px; 
            padding: 0 15px; 
            box-sizing: border-box;
        }

        h1 {
            font-size: clamp(28px, 5vw, 50px); 
            font-weight: bold;
            color: #c0202f;
            font-style: italic;   
            text-align: center;
            margin-top: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;            
            align-items: center;
            margin-top: 30px;
            font-size: 18px;
            border: none; 
            padding: 0;
        }

        #nivel {
           transition: opacity 0.5s ease-in-out;
        }
    </style>
  <title>JS - 6.2</title>
</head>
  
<body>
      
      
        <h1 class="font-bold block mb-1">Nivel de experiencia.</h1>
        <p class="par font-normal text-gray-700 text-s md:text-2xl">Crea un programa que solicite al usuario/a que introduzca su nombre y el número de años que lleva trabajando en una empresa. Después muestra por pantalla su nivel de experiencia, según la siguiente tabla:</p>
      
      <fieldset class="container w-full">
        <p class="flex flex-col md:flex-row items-stretch md:items-center w-full md:w-4/5 lg:w-2/3 my-3">
          <label for="nombre" class="w-full md:flex-1 text-left md:text-right md:pr-8 mb-1 md:mb-0 font-medium">Introduce su nombre</label>
          <input id="nombre" type="text" class="border-2 border-amber-800 w-full md:flex-1 rounded-lg pl-4 py-2" placeholder="nombre">
        </p>
      
        <p class="flex flex-col md:flex-row items-stretch md:items-center w-full md:w-4/5 lg:w-2/3 my-3">
          <label for="numero" class="w-full md:flex-1 text-left md:text-right md:pr-8 mb-1 md:mb-0 font-medium">Introduce el número de años que lleva trabajando en una empresa</label>
          <input id="numero" type="number" class="border-2 border-amber-800 w-full md:flex-1 rounded-lg pl-4 py-2" placeholder="el número de años">
        </p>     
        
        <button onclick="result()" id="btn" class="border-2 bg-[#c0202f] rounded-lg text-amber-100 px-6 py-2 mt-5 text-xl md:text-2xl cursor-pointer hover:bg-amber-100 hover:text-[#c0202f] transition-colors">Result</button>    
   
        <p class="bg-slate-200 border-2 border-amber-800 rounded-lg p-3 hidden opacity-0 text-center mt-10 w-full max-w-md text-xl md:text-2xl font-bold" id="nivel"></p>
      </fieldset>
        
  <script src="./js/app.js"></script>
</body>
</html>
